<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password · InGallery</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      body { background: #121414; color: #e2e2e2; }
      .glass-panel { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
      .btn-primary { background-color: #e9c349; color: #121414; letter-spacing: 0.1em; transition: all 0.3s ease; }
      .btn-primary:hover:not(:disabled) { transform: scale(1.02); opacity: 0.9; }
      .btn-primary:disabled { opacity: 0.65; cursor: wait; }
      .text-secondary { color: #e9c349; }
      .text-on-surface-variant { color: #c4c7c7; }
      .font-display { font-family: 'Playfair Display', serif; }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center px-6 font-sans">
    <main class="glass-panel max-w-lg w-full rounded-lg p-8">
      <p class="text-xs uppercase tracking-[0.2em] text-secondary text-center">InGallery</p>
      <h1 class="mt-4 font-display text-4xl text-center">Reset your password</h1>
      <p class="mt-3 text-on-surface-variant text-center">Enter your account email and we’ll send a secure recovery link.</p>

      <form data-password-recovery-form class="mt-8 space-y-4">
        <div class="space-y-2">
          <label for="recovery-email" class="text-xs uppercase tracking-[0.2em] text-on-surface-variant">Email</label>
          <input id="recovery-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" class="w-full rounded border border-white/10 bg-white/5 px-3 py-3 text-white outline-none focus:border-secondary" required>
        </div>
        <p data-password-recovery-message role="status" aria-live="polite" class="min-h-6 text-sm"></p>
        <button type="submit" class="btn-primary w-full rounded px-5 py-3 text-sm uppercase font-semibold">Send Recovery Link</button>
      </form>

      <a href="index.html" class="mt-6 block text-center text-sm text-secondary underline">Return to sign in</a>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
