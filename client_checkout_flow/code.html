<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

        },

<style>
        /* Progress Indicator Color Overrides for this specific context */
        .progress-spinner {
            border-top-color: #10B981; /* Success Green */
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen antialiased flex flex-col pt-20 overflow-x-hidden">
<!-- TopNavBar (Shared Component) -->
<nav class="bg-surface/80 backdrop-blur-xl dark:bg-surface-container-lowest/80 border-b border-white/10 fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20">
<!-- Brand -->
<div class="flex items-center gap-4">
<img hidden data-checkout-studio-logo alt="Studio logo" class="h-9 w-9 object-contain" />
<span class="text-headline-sm font-headline-sm tracking-tighter text-on-surface dark:text-primary-fixed" data-checkout-studio-name>InGallery</span>
</div>
</nav>
<!-- Main Checkout Canvas -->
<main class="flex-grow flex items-center justify-center py-margin-desktop px-margin-mobile md:px-margin-desktop w-full max-w-container-max mx-auto">
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter w-full">
<!-- Left Side: Gallery Details (Bento/Card Style) -->
<div class="col-span-1 md:col-span-6 lg:col-span-7 flex flex-col justify-center mb-12 md:mb-0">
<div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden group">
<!-- Image -->
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" data-alt="A stunning, high-end editorial wedding photograph capturing a bride and groom in a moment of quiet intimacy. The scene is set in an architectural space with dramatic, moody lighting characterized by deep, rich shadows and soft, directional highlights. The aesthetic perfectly complements a premium, minimalist digital gallery interface in dark mode, emphasizing elegant contrast, subtle grain, and a cinematic quality that feels exclusive and professionally curated." data-gallery-cover-image style="background-image: linear-gradient(135deg, rgba(233,195,73,0.15), rgba(17,24,39,0.8));">
</div>
<!-- Gradient Overlay for Text Readability -->
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/20 to-transparent"></div>
<!-- Gallery Meta Content -->
<div class="absolute bottom-0 left-0 w-full p-8 md:p-12">
<div class="inline-flex items-center gap-2 bg-surface-container-lowest/60 backdrop-blur-md px-3 py-1.5 rounded-DEFAULT mb-4 border border-white/10">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">photo_library</span>
<span class="text-label-sm font-label-sm text-on-surface" data-gallery-photo-count>Loading photos...</span>
</div>
<h1 class="text-headline-md md:text-display-lg font-headline-md md:font-display-lg text-on-surface leading-tight">
                            <span data-gallery-name>Gallery link required</span><br/>
<span class="text-on-surface-variant">Premium gallery access</span>
</h1>
</div>
</div>
</div>
<!-- Right Side: Payment Interaction -->
<div class="col-span-1 md:col-span-6 lg:col-span-4 lg:col-start-9 flex flex-col justify-center">
<div class="bg-surface-container-low/40 backdrop-blur-2xl border border-white/5 rounded-xl p-8 relative overflow-hidden min-h-[400px] flex flex-col justify-center">
<!-- State 1: Checkout Form -->
<div class="flex flex-col h-full transition-opacity duration-500 opacity-100 relative z-10" id="checkout-form">
<div class="mb-8">
<h2 class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest mb-2">Order Total</h2>
<div class="text-headline-lg font-headline-lg text-secondary" data-order-total>
                                Loading amount...
                            </div>
</div>
<div class="w-full h-px bg-white/10 mb-8"></div>
<div class="flex-grow flex flex-col justify-center">
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase mb-2 flex items-center gap-2" for="network">
<span class="material-symbols-outlined text-[18px]">network_cell</span>
Mobile money network
</label>
<select class="w-full mb-6 border-0 border-b border-white/20 bg-transparent text-body-md text-on-surface py-3 focus:ring-0 focus:border-secondary" id="network" required>
<option value="" selected disabled>Select network</option>
<option value="Mpesa">M-Pesa</option>
<option value="TigoPesa">Mixx by Yas</option>
<option value="AirtelMoney">Airtel Money</option>
<option value="HaloPesa">HaloPesa</option>
</select>
<label class="text-label-sm font-label-sm text-on-surface-variant uppercase mb-4 flex items-center gap-2" for="phone">
<span class="material-symbols-outlined text-[18px]">smartphone</span>
                                Mobile Payment Number
                            </label>
<!-- Minimalist Input Field -->
<div class="relative mb-12">
<input class="w-full bg-transparent border-0 border-b border-white/20 text-body-lg font-body-lg text-on-surface py-3 px-0 focus:ring-0 focus:border-secondary transition-colors placeholder:text-on-surface-variant/30" id="phone" placeholder="+255 700 000 000" type="tel" value="+255 "/>
</div>
<p class="mb-4 min-h-5 text-sm text-error" id="payment-error" role="alert"></p>
<!-- Primary Button -->
<button class="w-full bg-secondary text-on-secondary py-4 text-label-sm font-label-sm uppercase tracking-widest rounded-DEFAULT hover:scale-[1.02] transition-transform duration-300 flex justify-center items-center gap-2 group" id="pay-now" type="button">
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">lock</span>
<span data-pay-label>Pay Now</span>
                            </button>
</div>
</div>
<!-- State 2: Pending (Hidden Initially) -->
<div class="absolute inset-0 bg-surface-container-low/95 backdrop-blur-xl flex flex-col items-center justify-center p-8 text-center opacity-0 pointer-events-none transition-opacity duration-500 z-20" id="pending-state">
<!-- Progress Spinner using Success Green theme rule -->
<div class="w-16 h-16 border-4 border-surface-variant rounded-full animate-spin progress-spinner mb-8"></div>
<h3 class="text-headline-sm font-headline-sm text-on-surface mb-3">Awaiting Payment</h3>
<p class="text-body-md font-body-md text-on-surface-variant max-w-[250px]">
                            Payment request sent. Please complete the payment on your phone.
                        </p>
</div>
</div>
<div class="mt-6 flex justify-center items-center gap-2 text-on-surface-variant/50 text-label-sm font-label-sm">
<span class="material-symbols-outlined text-[14px]">shield</span>
                    Secured by InGallery Payments
                </div>
</div>
</div>
</main>
    <script type="module">
        import { createApiService, getApiBaseUrl, normalizeGalleryCheckoutState } from '../app.ts';

        const button = document.getElementById('pay-now');
        const buttonIcon = button?.querySelector('.material-symbols-outlined');
        const buttonLabel = button?.querySelector('[data-pay-label]');
        const form = document.getElementById('checkout-form');
        const pending = document.getElementById('pending-state');
        const errorMessage = document.getElementById('payment-error');
        const params = new URLSearchParams(window.location.search);
        const galleryId = params.get('galleryId');
        const api = createApiService(getApiBaseUrl());
        const galleryTitleNode = document.querySelector('[data-gallery-name]');
        const galleryImageNode = document.querySelector('[data-gallery-cover-image]');
        const galleryCountNode = document.querySelector('[data-gallery-photo-count]');
        const orderTotalNode = document.querySelector('[data-order-total]');
        const checkoutStudioName = document.querySelector('[data-checkout-studio-name]');
        const checkoutStudioLogo = document.querySelector('[data-checkout-studio-logo]');
        let checkoutAmount = null;
        let checkoutCurrency = 'TZS';

        const formatAmount = (amount, currency) => {
            const formatted = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(Number(amount ?? 0));
            return `${currency || 'TZS'} ${formatted}`;
        };

        const setCheckoutSummary = (summary) => {
            checkoutAmount = summary.accessPrice;
            checkoutCurrency = summary.currency || 'TZS';
            if (galleryTitleNode) {
                galleryTitleNode.textContent = summary.title;
            }
            if (galleryImageNode) {
                galleryImageNode.style.backgroundImage = summary.coverUrl ? `url('${summary.coverUrl}')` : 'linear-gradient(135deg, rgba(233,195,73,0.15), rgba(17,24,39,0.8))';
            }
            if (galleryCountNode) {
                galleryCountNode.textContent = `${summary.imageCount} Photos`;
            }
            if (orderTotalNode) {
                orderTotalNode.textContent = formatAmount(summary.accessPrice, summary.currency);
            }
        };

        const loadGallery = async () => {
            if (!galleryId) {
                if (errorMessage) errorMessage.textContent = 'This checkout link is missing a gallery reference.';
                return;
            }

            try {
                const response = await api.getPublicGallery(galleryId);
                if (checkoutStudioName && response.data.studioName) checkoutStudioName.textContent = response.data.studioName;
                if (checkoutStudioLogo && response.data.studioLogoUrl) {
                    checkoutStudioLogo.src = response.data.studioLogoUrl;
                    checkoutStudioLogo.hidden = false;
                }
                const summary = normalizeGalleryCheckoutState({
                    id: response.data.id,
                    title: response.data.title || params.get('gallery'),
                    slug: response.data.slug,
                    accessPrice: response.data.accessPrice,
                    currency: response.data.currency,
                    imageCount: response.data.imageCount,
                    coverUrl: response.data.coverUrl
                });
                setCheckoutSummary(summary);
            } catch (error) {
                const fallbackTitle = params.get('gallery') || 'Gallery unavailable';
                if (galleryTitleNode) galleryTitleNode.textContent = fallbackTitle;
                if (galleryCountNode) galleryCountNode.textContent = 'Photos unavailable';
                if (orderTotalNode) orderTotalNode.textContent = 'Amount unavailable';
                if (errorMessage) errorMessage.textContent = error instanceof Error ? error.message : 'Unable to load gallery details.';
                console.warn('Unable to load gallery details for checkout', error);
            }
        };

        button?.addEventListener('click', async () => {
            if (!galleryId) {
                if (errorMessage) errorMessage.textContent = 'This checkout link is missing a gallery reference.';
                return;
            }

            const phoneInput = document.getElementById('phone');
            const phone = phoneInput?.value.trim() ?? '';
            const network = document.getElementById('network')?.value ?? '';
            if (!phone) {
                if (errorMessage) errorMessage.textContent = 'Enter a mobile payment number to continue.';
                return;
            }
            if (!network) {
                if (errorMessage) errorMessage.textContent = 'Choose your mobile money network to continue.';
                return;
            }

            button.setAttribute('disabled', 'true');
            if (buttonIcon) {
                buttonIcon.textContent = 'progress_activity';
                buttonIcon.classList.add('animate-spin');
                buttonIcon.classList.remove('group-hover:translate-x-1');
            }
            if (buttonLabel) buttonLabel.textContent = 'Preparing secure checkout…';
            if (errorMessage) errorMessage.textContent = '';
            try {
                const result = await api.createCheckout(galleryId, {
                    email: params.get('email') ?? 'client@example.com',
                    phone,
                    network
                });
                try {
                    sessionStorage.setItem('ingallery:pending-gallery-payment', JSON.stringify({
                        orderReference: result.data.orderReference,
                        galleryId,
                        galleryTitle: galleryTitleNode?.textContent?.trim() || params.get('gallery') || '',
                        amount: checkoutAmount,
                        currency: checkoutCurrency
                    }));
                } catch {
                    if (!result.data.transactionId) throw new Error('This browser could not save the payment return session. Enable session storage and try again.');
                }
                form?.classList.add('opacity-0', 'pointer-events-none');
                pending?.classList.remove('opacity-0', 'pointer-events-none');
                window.location.href = result.data.checkoutUrl;
            } catch (error) {
                button.removeAttribute('disabled');
                if (buttonIcon) {
                    buttonIcon.textContent = 'lock';
                    buttonIcon.classList.remove('animate-spin');
                    buttonIcon.classList.add('group-hover:translate-x-1');
                }
                if (buttonLabel) buttonLabel.textContent = 'Pay Now';
                if (errorMessage) errorMessage.textContent = error instanceof Error ? error.message : 'Unable to start payment.';
            }
        });

        loadGallery();
    </script>
<script src="../shared-nav.js?v=11"></script>
</body></html>
