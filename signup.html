<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | InGallery</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { background: #121414; color: #e2e2e2; }
      .glass-panel {
        background: rgba(18, 18, 18, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .btn-primary {
        background-color: #e9c349;
        color: #121414;
        letter-spacing: 0.1em;
        transition: all 0.3s ease;
      }
      .btn-primary:hover { transform: scale(1.02); opacity: 0.9; }
    </style>
  </head>
  <body class="bg-background text-on-surface font-body antialiased">
    <div class="min-h-screen flex items-center justify-center px-6">
      <div class="glass-panel max-w-lg w-full rounded-lg p-8">
        <p class="text-xs uppercase tracking-[0.2em] text-secondary text-center">InGallery</p>
        <h1 class="mt-4 font-display text-4xl text-center">Create your studio</h1>
        <p class="mt-3 text-on-surface-variant text-center">Launch your portfolio, unlock galleries, and manage clients.</p>

        <form data-signup-form data-redirect="photographer_dashboard_overview/code.html" class="mt-8 space-y-4">
          <div class="space-y-2">
            <label for="name" class="text-xs uppercase tracking-[0.2em] text-on-surface-variant">Full name</label>
            <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" class="w-full rounded border border-white/10 bg-white/5 px-3 py-3 text-white outline-none focus:border-secondary" required />
          </div>
          <div class="space-y-2">
            <label for="signup-email" class="text-xs uppercase tracking-[0.2em] text-on-surface-variant">Email</label>
            <input id="signup-email" name="email" type="email" placeholder="you@studio.com" class="w-full rounded border border-white/10 bg-white/5 px-3 py-3 text-white outline-none focus:border-secondary" required />
          </div>
          <div class="space-y-2">
            <label for="signup-password" class="text-xs uppercase tracking-[0.2em] text-on-surface-variant">Password</label>
            <input id="signup-password" name="password" type="password" placeholder="Minimum 6 characters" class="w-full rounded border border-white/10 bg-white/5 px-3 py-3 text-white outline-none focus:border-secondary" required />
          </div>
          <div data-signup-message class="min-h-[20px] text-sm text-secondary"></div>
          <button type="submit" class="btn-primary w-full rounded px-5 py-3 text-sm uppercase font-semibold">Create Account</button>
        </form>

        <div class="mt-6 text-center text-sm text-on-surface-variant">
          Already have an account?
          <a href="index.html" class="text-secondary underline">Sign in</a>
        </div>
      </div>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
