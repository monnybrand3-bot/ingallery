<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · InGallery</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>body{background:#121414;color:#e2e2e2}input{background:#121414!important;border-color:#444748!important;color:#e2e2e2!important}</style>
</head>
<body class="min-h-screen flex items-center justify-center px-5 font-sans">
  <main class="w-full max-w-md border border-white/10 bg-[#191b1b] p-8">
    <p class="text-center text-xs uppercase tracking-[.2em] text-[#e9c349]">InGallery</p>
    <h1 class="mt-4 text-center font-serif text-3xl">Choose a new password</h1>
    <p class="mt-3 text-center text-sm text-[#c4c7c7]">Use at least 8 characters.</p>
    <form id="reset-form" class="mt-6 space-y-4">
      <label class="block text-sm">New password<input id="new-password" type="password" minlength="8" autocomplete="new-password" required class="mt-2 w-full border px-3 py-3"></label>
      <label class="block text-sm">Confirm password<input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required class="mt-2 w-full border px-3 py-3"></label>
      <p id="reset-message" role="status" class="min-h-5 text-sm"></p>
      <button class="w-full bg-[#e9c349] px-5 py-3 text-sm font-semibold uppercase text-[#121414]">Update password</button>
    </form>
    <a class="mt-5 block text-center text-sm text-[#e9c349] underline" href="/index.html">Return to sign in</a>
  </main>
  <script type="module">
    import { getApiBaseUrl } from './app.ts';
    const form = document.querySelector('#reset-form');
    const message = document.querySelector('#reset-message');
    const accessToken = new URLSearchParams(location.hash.slice(1)).get('access_token');
    if (!accessToken) { message.textContent = 'This password reset link is invalid or expired. Ask the system administrator to send another one.'; message.className += ' text-[#ffb4ab]'; form.querySelector('button').disabled = true; }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.querySelector('#new-password').value;
      if (password !== document.querySelector('#confirm-password').value) { message.textContent = 'The passwords do not match.'; message.className = 'min-h-5 text-sm text-[#ffb4ab]'; return; }
      try {
        const response = await fetch(`${getApiBaseUrl()}/api/auth/password/recovery`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accessToken, password }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Could not update password.');
        history.replaceState(null, '', location.pathname);
        message.textContent = 'Password updated. You can now sign in with your new password.';
        message.className = 'min-h-5 text-sm text-[#4edea3]';
        form.reset();
      } catch (error) { message.textContent = error instanceof Error ? error.message : 'Could not update password.'; message.className = 'min-h-5 text-sm text-[#ffb4ab]'; }
    });
  </script>
</body>
</html>
