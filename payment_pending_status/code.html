<script type="module">
    import { createApiService, getApiBaseUrl } from '../app.ts';

    const params = new URLSearchParams(window.location.search);
    const transactionId = params.get('transactionId');
    let pendingPayment = null;
    try { pendingPayment = JSON.parse(sessionStorage.getItem('ingallery:pending-package-payment') || 'null'); } catch {}
    const isPackagePayment = params.get('type') === 'package' || Boolean(pendingPayment?.orderReference && !params.has('galleryId') && !params.has('gallery'));
    const orderReference = params.get('reference') || pendingPayment?.orderReference || '';
    const packageName = params.get('package') || pendingPayment?.packageName || pendingPayment?.name || '';
    const titleNode = document.querySelector('[data-order-title]');
    const amountNode = document.querySelector('[data-order-amount]');
    const statusNode = document.querySelector('[data-payment-status]');

    const formatAmount = (amount, currency = 'TZS') => {
        const formatted = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(Number(amount ?? 0));
        return `${currency} ${formatted}`;
    };

    const inferPaymentState = (payload) => {
        const data = payload?.data ?? payload;
        const statusValue = String(data?.status ?? data?.state ?? data?.paymentStatus ?? data?.payment_status ?? data?.transaction_status ?? payload?.status ?? '').toUpperCase();
        if (['SUCCESS', 'PAID', 'COMPLETED', 'APPROVED'].includes(statusValue)) return 'SUCCESS';
        if (['FAILED', 'DECLINED', 'CANCELLED', 'CANCELED', 'REJECTED'].includes(statusValue)) return 'FAILED';
        return 'PENDING';
    };

    const updateSummary = () => {
        if (titleNode) titleNode.textContent = packageName || 'Selected package';
        const amount = params.get('amount') || pendingPayment?.amount;
        const currency = params.get('currency') || pendingPayment?.currency || 'TZS';
        if (amountNode) amountNode.textContent = amount == null ? 'Amount unavailable' : formatAmount(amount, currency);
    };

    if (statusNode) statusNode.textContent = 'Waiting for confirmation...';
    updateSummary();

    const pollPayment = async () => {
        if (!transactionId && !orderReference) {
            if (statusNode) statusNode.textContent = 'Missing payment reference for this package.';
            return;
        }

        try {
            const statusUrl = isPackagePayment
                ? `${getApiBaseUrl()}/api/platform/payments/orders/${encodeURIComponent(orderReference)}/status`
                : transactionId
                    ? `${getApiBaseUrl()}/api/payments/malipo/status/${encodeURIComponent(transactionId)}`
                    : `${getApiBaseUrl()}/api/payments/orders/${encodeURIComponent(orderReference)}/status`;
            const response = await fetch(statusUrl);
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.message || 'Unable to verify payment.');
            const state = inferPaymentState(payload);

            if (state === 'SUCCESS') {
                if (isPackagePayment) {
                    if (statusNode) statusNode.textContent = 'Package payment confirmed. Your plan is active.';
                    try { sessionStorage.removeItem('ingallery:pending-package-payment'); } catch {}
                    return;
                }
                const accessToken = payload?.data?.accessToken;
                if (!accessToken) {
                    if (statusNode) statusNode.textContent = 'Payment confirmed, but package access could not be issued. Contact support.';
                    return;
                }
                if (statusNode) statusNode.textContent = 'Package payment confirmed.';
                try { sessionStorage.removeItem('ingallery:pending-package-payment'); } catch {}
                return;
            }

            if (state === 'FAILED' && statusNode) {
                statusNode.textContent = isPackagePayment ? 'Package payment was not completed.' : 'Payment was not completed.';
                return;
            }

            if (statusNode) statusNode.textContent = 'Waiting for confirmation...';
            setTimeout(pollPayment, 5000);
        } catch (error) {
            console.warn('Unable to poll payment status', error);
            if (statusNode) statusNode.textContent = 'Waiting for confirmation...';
            setTimeout(pollPayment, 5000);
        }
    };

    pollPayment();
</script>
